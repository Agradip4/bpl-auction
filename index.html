<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BPL Auction Login</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;margin:0;background:linear-gradient(135deg,#020617,#0f172a);color:#f8fafc;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:#0f172a;border:1px solid #334155;border-radius:16px;padding:24px}h1{color:#fbbf24}p,.hint{color:#cbd5e1;line-height:1.6}label{display:block;margin:16px 0 8px;font-weight:bold;color:#fde68a}select,input,button{width:100%;padding:12px;border-radius:10px;font-size:16px}select,input{background:#0b1220;color:#fff;border:1px solid #64748b}button{margin-top:18px;background:#f59e0b;border:0;font-weight:bold;cursor:pointer}a{color:#7dd3fc}#passwordField,#passwordError{display:none}#passwordError{color:#f87171;margin-top:8px;font-size:14px}</style></head><body><div class="card"><a href="history.html">← All auction events</a><h1>🏏 Enter Auction</h1><p id="eventLabel">Choose your role for this auction event.</p><label for="roleSelect">Choose role</label><select id="roleSelect"><option>Bidder</option><option>Team A</option><option>Team B</option><option>Team C</option><option>Team D</option><option>Team E</option><option>Audience</option></select><label for="displayName">Your name</label><input id="displayName" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Sagnik"><div id="nameError" style="display:none;color:#f87171;margin-top:8px;font-size:14px">Please enter your name.</div><div id="passwordField"><label for="bidderPassword">Bidder password</label><input id="bidderPassword" type="password" autocomplete="off"><div id="passwordError">Incorrect password. Try again.</div></div><button id="loginBtn">Enter Auction</button><div class="hint">The selected event is saved on the server, so a refresh or server restart does not erase it.</div></div><script>const eventId=new URLSearchParams(location.search).get('event');if(!eventId)location.replace('history.html');const role=document.getElementById('roleSelect'),field=document.getElementById('passwordField'),pass=document.getElementById('bidderPassword'),nameInput=document.getElementById('displayName'),nameError=document.getElementById('nameError');role.onchange=()=>{field.style.display=role.value==='Bidder'?'block':'none'};role.onchange();nameInput.value=localStorage.getItem('bplName')||'';document.getElementById('loginBtn').onclick=()=>{const name=nameInput.value.trim();if(!name){nameError.style.display='block';nameInput.focus();return}nameError.style.display='none';if(role.value==='Bidder'&&pass.value!=='Fifa6'){document.getElementById('passwordError').style.display='block';return}localStorage.setItem('bplRole',role.value);localStorage.setItem('bplName',name);if(role.value==='Bidder')localStorage.setItem('bplBidderPassword',pass.value);else localStorage.removeItem('bplBidderPassword');location.href='auction.html?event='+encodeURIComponent(eventId)+'&role='+encodeURIComponent(role.value)+'&name='+encodeURIComponent(name)};fetch('/api/events').then(r=>r.json()).then(events=>{const e=events.find(x=>x.id===eventId);if(e)document.getElementById('eventLabel').textContent=`${e.name} — ${e.status==='live'?'live auction':'completed auction (view only)'}. Choose your role.`})</script></body></html>
