<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BPL Auction History</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;background:#020617;color:#f8fafc;padding:32px}main{max-width:900px;margin:auto}h1{color:#fbbf24;margin-bottom:6px}p{color:#cbd5e1}.create,.backups,.manage{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}input,button{border-radius:9px;padding:12px;border:1px solid #64748b;font-size:15px}input{flex:1;background:#0f172a;color:#fff}button{background:#f59e0b;color:#111827;border:0;font-weight:700;cursor:pointer}.backups button{background:#475569;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.event{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px}.event h2{font-size:19px;margin:0 0 12px}.meta{font-size:14px;color:#94a3b8;line-height:1.6}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:bold;margin:0 5px 9px 0}.live{background:#14532d;color:#bbf7d0}.completed{background:#334155;color:#cbd5e1}.locked{background:#7f1d1d;color:#fecaca}.event>button{width:100%;margin-top:14px}.manage{margin:8px 0 0}.manage button{flex:1;background:#334155;color:#f8fafc}.manage .delete{background:#b91c1c}.empty{padding:35px;text-align:center;background:#0f172a;border-radius:14px;color:#94a3b8}</style></head><body><main><h1>BPL Auction Events</h1><p>Choose a live auction to continue, or review completed auctions.</p><div class="create"><input id="eventName" maxlength="80" placeholder="New auction name (e.g. BPL 2026 Final)"><button id="createBtn">Create Event</button></div><div class="backups"><button id="exportBtn">Export All Events Backup</button><button id="importBtn">Import Full Backup</button><input id="backupFile" type="file" accept="application/json" hidden></div><div id="events" class="grid"><div class="empty">Loading auction history...</div></div></main><script>const list=document.getElementById('events'),format=time=>time?new Date(time).toLocaleString():'';async function load(){try{const events=await (await fetch('/api/events')).json();if(!events.length){list.innerHTML='<div class="empty">No auction events yet. Create your first event above.</div>';return}list.innerHTML=events.map(e=>`<article class="event"><span class="badge ${e.status}">${e.status==='live'?'LIVE':'COMPLETED'}</span>${e.locked?'<span class="badge locked">LOCKED</span>':''}<h2>${escapeHtml(e.name)}</h2><div class="meta">Created: ${format(e.createdAt)}<br>Sold: ${e.soldCount} · Remaining: ${e.remainingCount}<br>Last activity: ${format(e.updatedAt)}</div><button onclick="openEvent('${e.id}')">${e.status==='live'?'Continue Auction':'View Completed Auction'}</button><div class="manage"><button onclick="setLock('${e.id}',${!e.locked})">${e.locked?'Unlock':'Lock'}</button><button class="delete" onclick="deleteEvent('${e.id}')">Delete</button></div></article>`).join('')}catch(_){list.innerHTML='<div class="empty">Could not load events. Start the Node server and refresh.</div>'}}function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function bidderPassword(action){return prompt(`Enter bidder password to ${action}:`)}function openEvent(id){location.href='index.html?event='+encodeURIComponent(id)}async function setLock(id,locked){const password=bidderPassword(locked?'lock':'unlock');if(password===null)return;const res=await fetch(`/api/events/${id}/lock`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,locked})});if(!res.ok)return alert((await res.json()).message||'Could not change lock.');load()}async function deleteEvent(id){if(!confirm('Delete this event permanently? This cannot be undone.'))return;const password=bidderPassword('permanently delete this event');if(password===null)return;const res=await fetch(`/api/events/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!res.ok)return alert((await res.json()).message||'Could not delete event.');load()}document.getElementById('createBtn').onclick=async()=>{const input=document.getElementById('eventName'),res=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value})});if(res.ok)openEvent((await res.json()).id);else alert('Could not create auction event.')};document.getElementById('exportBtn').onclick=async()=>{const password=bidderPassword('export every auction event');if(password===null)return;const res=await fetch('/api/backups/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!res.ok)return alert((await res.json()).message||'Export failed.');const blob=new Blob([JSON.stringify(await res.json(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`bpl-auction-history-backup-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click();URL.revokeObjectURL(url)};document.getElementById('importBtn').onclick=()=>document.getElementById('backupFile').click();document.getElementById('backupFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;let backup;try{backup=JSON.parse(await file.text())}catch(_){return alert('That file is not valid JSON.')}if(!confirm('This replaces ALL current events with the backup. Continue?'))return;const password=bidderPassword('restore this backup');if(password===null)return;const res=await fetch('/api/backups/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,backup})});if(!res.ok)return alert((await res.json()).message||'Import failed.');alert(`Restored ${(await res.json()).restored} event(s).`);load()};load()</script></body></html>
